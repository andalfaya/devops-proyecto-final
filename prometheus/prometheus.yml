global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['192.168.49.2:8091']   # nombre del servicio en docker-compose

  - job_name: 'backend'
    static_configs:
      - targets: ['192.168.49.2:8001']    # usando IP y puerto

  - job_name: 'frontend'
    static_configs:
      - targets: ['192.168.49.2:8081']    # usando IP y puerto

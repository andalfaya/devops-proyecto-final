apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: tuimagen/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres.stg.svc.cluster.local:5432/postgres"

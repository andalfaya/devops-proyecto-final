name: Deployment Workflow

on:
  push:
    branches:
      - dev
      - stg
      - prod
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}
  ENVIRONMENT: ${{ github.ref_name }}
  # Si la rama es prod => latest, si no => nombre de la rama
  IMAGE_TAG: ${{ github.ref_name == 'prod' && 'latest' || github.ref_name }}
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/frontend

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }}
      frontend_image: ${{ env.IMAGE_FRONTEND }}:${{ env.IMAGE_TAG }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        run: |
          docker build -t $IMAGE_BACKEND:$IMAGE_TAG ./backend
          docker push $IMAGE_BACKEND:$IMAGE_TAG

      - name: Build and push frontend
        run: |
          docker build -t $IMAGE_FRONTEND:$IMAGE_TAG ./frontend
          docker push $IMAGE_FRONTEND:$IMAGE_TAG

  check-minikube:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Check Minikube status
        run: |
          if ! minikube status | grep -q "Running"; then
            echo "Minikube no está corriendo. Relanzandolo..."
            minikube start --driver=docker --cpus=2 --memory=2048 --extra-config=apiserver.service-node-port-range=8000-9000
          else
            echo "Minikube está activo"

  terraform:
    runs-on: self-hosted
    needs: check-minikube
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Destroy
        run: terraform -chdir=terraform destroy -auto-approve -var="env=${ENVIRONMENT}"

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve \
          -var="env=${ENVIRONMENT}" \
          -var="backend_image=${{ needs.build-and-push.outputs.backend_image }}" \
          -var="frontend_image=${{ needs.build-and-push.outputs.frontend_image }}"

      - name: Get Terraform outputs
        id: tf_outputs
        run: |
          echo "BACKEND_URL=$(terraform -chdir=terraform output -raw backend_url)" >> $GITHUB_ENV
          echo "FRONTEND_URL=$(terraform -chdir=terraform output -raw frontend_url)" >> $GITHUB_ENV

  ansible:
    runs-on: self-hosted
    needs: terraform
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible
      - name: Validate services
        run: ansible-playbook -i ansible/inventory/local.ini ansible/playbooks/validate.yml \
          --extra-vars "backend_url=${BACKEND_URL} frontend_url=${FRONTEND_URL}"

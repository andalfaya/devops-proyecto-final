name: CI/CD Local Runner

on:
  push:
    branches:
      - 'feature_*'
      - dev
  pull_request:
    branches:
      - dev
      - stg
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests"
        required: true
        default: "dev"

jobs:
  load_thresholds:
    name: Load quality thresholds
    runs-on: ubuntu-latest
    outputs:
      pylint_threshold: ${{ steps.set-vars.outputs.pylint }}
      coverage_threshold: ${{ steps.set-vars.outputs.coverage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read thresholds from file
        id: set-vars
        run: |
          branch=$(echo "${GITHUB_REF##*/}")
          PYLINT=$(yq ".${branch}.pylint // .default.pylint" quality-thresholds.yml)
          COVERAGE=$(yq ".${branch}.coverage // .default.coverage" quality-thresholds.yml)
          echo "pylint=$PYLINT" >> $GITHUB_OUTPUT
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
  
  generate_environment:
    name: Generate environment
    runs-on: self-hosted
    needs: load_thresholds
    outputs:
      cache-key: ${{ steps.cache-venv.outputs.cache-key }}

    steps:
      # 1 - Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
      
      # 2 - Start test environment with Docker Compose
      - name: Start Docker Compose for Tests
        run: |
          docker compose -f docker-compose.test.yml down || true
          docker compose -f docker-compose.test.yml up -d --build
          # Wait for Postgres, backend and frontend to be ready
          sleep 20

  lint_test_quality:
    name: Lint test quality
    runs-on: ubuntu-latest
    needs: [load_thresholds, generate_environment]

    steps:
      # 1 - Checkout repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      # 4 -  Create virtual environment
      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Activate virtual environment
        run: |
          python3 --version
      
      # 3 - Install pylint
      - name: Install pylint
        run: |
          pip install -r backend/requirements.txt
          pip install -r frontend/requirements.txt
          pip install pylint

      # 4 - Lint backend with pylint script
      - name: Run Pylint Backend (score enforcement)
        run: |
          chmod +x scripts/check_pylint_score.sh
          ./scripts/check_pylint_score.sh backend ${{ needs.load_thresholds.outputs.pylint_threshold }}

      # 5 - Lint frontend with pylint script
      - name: Run Pylint Frontend (score enforcement)
        run: |
          chmod +x scripts/check_pylint_score.sh
          ./scripts/check_pylint_score.sh frontend ${{ needs.load_thresholds.outputs.pylint_threshold }}

  coverage_test_quality:
    name: Coverage test quality
    runs-on: self-hosted
    needs: [load_thresholds, generate_environment, lint_test_quality]

    steps:
      # 1 - Checkout repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          
      - name: Wait for Postgres (max 12 attempts)
        run: |
          max_attempts=12
          attempt=1
          until docker compose -f docker-compose.test.yml exec -T postgres pg_isready -U postgres; do
            if [ $attempt -ge $max_attempts ]; then
              echo "PostgreSQL no disponible tras $max_attempts intentos"
              exit 1
            fi
            echo "Esperando a PostgreSQL... intento $attempt/$max_attempts"
            attempt=$((attempt+1))
            sleep 5
          done
          echo "PostgreSQL está listo"

      - name: Install test dependencies in backend and frontend container
        run: |
          docker compose -f docker-compose.test.yml exec -T backend pip install pytest pytest-cov coverage
          docker compose -f docker-compose.test.yml exec -T frontend pip install pytest pytest-cov coverage

      - name: Run backend tests inside container
        run: |
          docker compose -f docker-compose.test.yml exec -T backend bash -c "
            export PYTHONPATH=/app &&
            echo 'PYTHONPATH is set to:' \$PYTHONPATH &&
            ls -la /app &&
            pytest /app/tests -v \
              --cov=/app \
              --cov-report=term \
              --cov-report=xml:/app/coverage-backend.xml \
              --cov-report=html:/app/htmlcov-backend
          "

      - name: Copy coverage reports from container
        run: |
          docker compose -f docker-compose.test.yml cp backend:/app/coverage-backend.xml coverage-backend.xml
          docker compose -f docker-compose.test.yml cp backend:/app/htmlcov-backend htmlcov-backend

      - name: Check coverage threshold
        run: |
          chmod +x scripts/check_coverage_threshold.sh
          ./scripts/check_coverage_threshold.sh coverage-backend.xml ${{ needs.load_thresholds.outputs.coverage_threshold }}

      - name: Run frontend tests inside container
        run: |
          docker compose -f docker-compose.test.yml exec -T frontend bash -c "
            export PYTHONPATH=/app &&
            echo 'PYTHONPATH is set to:' \$PYTHONPATH &&
            ls -la /app &&
            pytest /app/tests -v \
              --cov=/app \
              --cov-report=term \
              --cov-report=xml:/app/coverage-frontend.xml \
              --cov-report=html:/app/htmlcov-frontend
          "

      - name: Copy coverage reports from container
        run: |
          docker compose -f docker-compose.test.yml cp frontend:/app/coverage-frontend.xml coverage-frontend.xml
          docker compose -f docker-compose.test.yml cp frontend:/app/htmlcov-frontend htmlcov-frontend

      - name: Check coverage threshold
        run: |
          chmod +x scripts/check_coverage_threshold.sh
          ./scripts/check_coverage_threshold.sh coverage-frontend.xml ${{ needs.load_thresholds.outputs.coverage_threshold }}

      # Upload unified coverage reports
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-backend.xml
            htmlcov-backend/
            coverage-frontend.xml
            htmlcov-frontend/
          retention-days: 1
          
      # 7 - Display coverage summary
      - name: Display coverage summary
        if: always()
        run: |
          echo "Coverage Summary:"
          echo "==================="

          show_coverage () {
            FILE=$1
            LABEL=$2
            if [ -f "$FILE" ]; then
              LINE=$(grep -o 'line-rate="[0-9.]*"' "$FILE" | sed 's/.*="//;s/"//')
              BRANCH=$(grep -o 'branch-rate="[0-9.]*"' "$FILE" | sed 's/.*="//;s/"//')
              LINE_PERCENT=$(awk "BEGIN {print $LINE*100}")
              BRANCH_PERCENT=$(awk "BEGIN {print $BRANCH*100}")
              echo "$LABEL → Line Coverage: ${LINE_PERCENT}% | Branch Coverage: ${BRANCH_PERCENT}%"
            else
              echo "$LABEL → Coverage file not found ($FILE)"
            fi
          }

          show_coverage coverage-backend.xml "Backend"
          show_coverage coverage-frontend.xml "Frontend"

  sonar_test_quality:
    name: SonarQube Analysis with Coverage
    runs-on: self-hosted
    needs: [load_thresholds, generate_environment, lint_test_quality, coverage_test_quality]
    env:
      SONAR_PROJECT_KEY: devops-proyecto-final
      SONAR_PROJECT_NAME: DevOps Lab Projecto Final
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: http://localhost:9000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports

      - name: Run SonarQube Scan with Coverage
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000

      - name: Wait & check SonarQube quality gate
        run: |
          chmod +x scripts/check_sonar_quality_gate.sh
          ./scripts/check_sonar_quality_gate.sh $SONAR_PROJECT_KEY 180

      - name: Display SonarQube metrics
        if: always()
        run: |
          echo "🎯 SonarQube Analysis Complete!"
          echo "================================"
          echo "📊 Check your SonarQube dashboard at: $SONAR_HOST_URL"
          echo "🔍 Project: $SONAR_PROJECT_KEY"
          echo "📈 Coverage data has been integrated with code quality metrics"

  trivy_test_quality:
    name: Trivy security scan
    runs-on: ubuntu-latest
    needs: [load_thresholds, generate_environment, lint_test_quality, coverage_test_quality, sonar_test_quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Build Docker images
        run: | 
          docker build -t backend:latest ./backend
          docker build -t frontend:latest ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:latest
          format: 'table'
          output: 'trivy-results_backend.txt'
          severity: 'CRITICAL,HIGH'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:latest
          format: 'table'
          output: 'trivy-results_frontend.txt'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: |
            trivy-results_backend.txt
            trivy-results_frontend.txt
          retention-days: 30

      - name: Display Trivy scan results
        if: always()
        run: |
          echo "🔍 Security Scan Results"
          echo "============================================="

          for file in trivy-results_backend.txt trivy-results_frontend.txt; do
            if [ -f "$file" ]; then
              echo ""
              echo "📦 Results for $file"
              echo "---------------------------------------------"
              cat "$file"
              CRITICAL=$(grep -c "CRITICAL" "$file" || echo "0")
              HIGH=$(grep -c "HIGH" "$file" || echo "0")
              echo ""
              echo "📊 Summary for $file:"
              echo "  🔴 Critical: $CRITICAL"
              echo "  🟠 High: $HIGH"
            else
              echo "❌ Trivy scan results not found for $file"
            fi
          done

  clean_environment:
    name: Clean environment
    runs-on: self-hosted
    needs: [load_thresholds, generate_environment, lint_test_quality, coverage_test_quality, sonar_test_quality, trivy_test_quality]
    if: always()  # Ensure cleanup runs even if previous jobs fail
    
    steps:
      # 1 - Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
      
      # 2 - Remove virtual environment
      - name: Cleanup venv
        run: |
          echo "🧹 Cleaning up virtual environment..."
          rm -rf venv
          
      # 3 - Stop and clean Docker Compose
      - name: Stop Docker Compose
        run: |
          docker compose -f docker-compose.test.yml down

  report:
    name: Consolidated Quality Report
    needs: [load_thresholds, generate_environment, lint_test_quality, coverage_test_quality, sonar_test_quality, trivy_test_quality, clean_environment]
    if: always()
    runs-on: ubuntu-latest
    env:
      SONAR_PROJECT_KEY: devops-proyecto-final
      SONAR_HOST_URL: http://localhost:9000
    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: test-results/coverage

      - name: Download Trivy results
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: test-results/trivy

      - name: Generate Consolidated Summary
        run: |
          echo "## 🧪 CI/CD Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Lint" >> $GITHUB_STEP_SUMMARY
          echo "Lint checks executed via pylint scripts (backend & frontend)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/coverage/coverage.xml ]; then
            LINE=$(grep 'line-rate' test-results/coverage/coverage.xml | sed 's/.*line-rate="\(.*\)".*/\1/')
            BRANCH=$(grep 'branch-rate' test-results/coverage/coverage.xml | sed 's/.*branch-rate="\(.*\)".*/\1/')
            echo "Line Coverage: $(awk "BEGIN {print $LINE*100}")% | Branch Coverage: $(awk "BEGIN {print $BRANCH*100}")%" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not found." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 SonarQube" >> $GITHUB_STEP_SUMMARY
          echo "SonarQube analysis executed. Check dashboard at $SONAR_HOST_URL (Project: $SONAR_PROJECT_KEY)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Trivy Security Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/trivy/trivy-results.txt ]; then
            CRITICAL=$(grep -c "CRITICAL" test-results/trivy/trivy-results.txt || echo "0")
            HIGH=$(grep -c "HIGH" test-results/trivy/trivy-results.txt || echo "0")
            echo "Critical: $CRITICAL | High: $HIGH" >> $GITHUB_STEP_SUMMARY
          else
            echo "Trivy results not found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Print Environment
        run: echo "Running in ${{ github.event.inputs.environment }}"

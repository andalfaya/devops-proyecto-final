sonar.projectKey=devops-proyecto-final
sonar.projectName=DevOps Lab Projecto Final
sonar.projectVersion=1.0

# Fuentes y tests (analizar solo backend y frontend)
sonar.sources=backend,frontend
sonar.tests=backend,frontend
sonar.test.inclusions=**/test_*.py,**/*_test.py,**/*.spec.js,**/*.test.js

# Python / cobertura
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage-backend.xml,coverage-frontend.xml

# Reportes de pruebas unitarias (JUnit) si los generas)
sonar.junit.reportPaths=backend/tests/results.xml,frontend/tests/results.xml

# Exclusiones aplicadas solo dentro de backend/ y frontend/
sonar.exclusions=backend/**/__pycache__/**,backend/**/*.test.*,backend/**/node_modules/**,backend/**/dist/**,backend/**/build/**,frontend/**/__pycache__/**,frontend/**/*.test.*,frontend/**/node_modules/**,frontend/**/dist/**,frontend/**/build/**

# Exclusiones para cálculo de cobertura
sonar.coverage.exclusions=**/test_*.py,**/*_test.py,**/venv/**,**/scripts/**

# Ajustes adicionales
sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8
